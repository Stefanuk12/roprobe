name: Sync submodule

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-luau-lsp-plugin:
    name: Sync luau-lsp plugin submodule
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodule to latest
        run: git submodule update --remote --recursive vendor/luau-lsp-plugin/luau-lsp

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- vendor/luau-lsp-plugin/luau-lsp; then
            echo "Submodule already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rev="$(git -C vendor/luau-lsp-plugin/luau-lsp rev-parse --short HEAD)"
          git add vendor/luau-lsp-plugin/luau-lsp
          git commit -m "chore(plugin): sync luau-lsp plugin submodule to ${rev}"
          git push
