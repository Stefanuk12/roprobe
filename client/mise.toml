[settings]
experimental = true
all_compile = false

[vars]
stylua_args = "-f .meta/stylua.toml -g '**/*.lua' -g '**/*.luau' -g '!**/*.d.luau'"

[tools]
"github:Stefanuk12/darklua" = "0.19.0"
"github:lune-org/lune" = "0.10.2"
"github:JohnnyMorganz/luau-lsp" = "1.68.1"
"github:rojo-rbx/rojo" = "7.7.0"
"aqua:Kampfkarren/selene" = "0.31.0"
"aqua:JohnnyMorganz/StyLua" = "2.5.2"

[hooks]
postinstall = "lune run .meta/scripts/postinstall"

[tasks.deps]
description = "Install pesde dependencies"
run = "pesde install"
sources = ["pesde.toml", "pesde.lock"]
outputs = ["roblox_packages/**", "luau_packages/**", "lune_packages/**"]

[tasks.lint]
description = "Lint the source via selene"
run = "selene --config .meta/selene.toml src/"

[tasks.format]
description = "Format the source via stylua"
run = "stylua {{ vars.stylua_args }} -- src"

[tasks.format-check]
description = "Check formatting of the source via stylua"
run = "stylua {{ vars.stylua_args }} --check -- src"

[tasks.fetch-types]
description = "Download Roblox type definitions"
run = "curl -fsSL https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.lua -o ./roblox.d.luau"

[tasks.executor-types]
description = "Stage the executor type definitions, migrating them to luau-lsp's current syntax"
depends = ["deps"]
run = "lune run .meta/scripts/executor-types"
sources = ["luau_packages/.pesde/stefanuk12+luau_defs/**"]
outputs = [".meta/types/*"]

[tasks.sourcemap]
description = "Generate sourcemap via rojo (paths re-rooted to the monorepo root)"
depends = ["deps"]
run = "lune run .meta/scripts/sourcemap"
sources = ["default.project.json", "src/**/*.luau"]
outputs = [".meta/sourcemap.json"]

[tasks.actor-source]
description = "Bundle the actor half of the remote spy and stage it for embedding"
depends = ["deps"]
run = "lune run .meta/scripts/actor-source"
sources = ["src/**/*.luau", ".meta/.darklua.actor.json"]
outputs = [".meta/generated/actorSource.luau"]

[tasks.check]
description = "Check the source via luau-lsp"
depends = ["deps", "fetch-types", "executor-types", "actor-source"]
run = """
luau-lsp analyze --no-flags-enabled --flag:LuauSolverV2=true --platform roblox \
    --definitions "@roblox=./roblox.d.luau" \
    --definitions "@custom=./.meta/types/environment.d.luau" \
    --definitions "@luarmor=./.meta/types/luarmor.d.luau" \
    --definitions "@luraph=./.meta/types/luraph.d.luau" \
    --ignore "**/roblox_packages/**" src
"""

[tasks.build]
description = "Build the script via darklua (no args = build main)"
depends = ["deps", "actor-source"]
run = "lune run .meta/scripts/build"

[tasks.test]
description = "Run the end-to-end tests: the client's source, sandboxed under lune, against a real broker"
depends = ["deps", "actor-source"]
run = "lune run .meta/scripts/test"

[tasks.clean]
description = "Remove build artifacts and downloaded packages"
run = "lune run .meta/scripts/clean"

[tasks.init]
description = "Initialise the project with all relevant information"
run = "lune run .meta/scripts/init"

[tasks.check-update]
description = "Sync CLAUDE.md from upstream if newer and locally unedited (append 'rebaseline' to re-record the lock)"
run = "lune run .meta/scripts/check-update"

[tasks.ci]
description = "Run the entire CI pipeline"
depends = ["sourcemap", "lint", "format-check", "check", "build main"]

[tasks.cd]
description = "Run the entire CD pipeline"
depends = ["sourcemap", "build main"]
