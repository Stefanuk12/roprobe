[package]
name = "broker"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
rand = "0.10"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
squash = { git = "https://github.com/Stefanuk12/squash-rs" }
thiserror = "2.0"
rbx_dom_weak = "4.2.0"

# Temporary: the local squash-rs has an unpushed `Axes` read-path fix
# (bottom/front were transposed). Remove once it's committed + pushed and
# `cargo update -p squash` picks it up.
[patch."https://github.com/Stefanuk12/squash-rs"]
squash = { path = "../../squash-rs/squash" }